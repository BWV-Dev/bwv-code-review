language: "vi-VN"
tone_instructions: "Keep reviews concise and prioritize critical issues. Skip pleasantries and go directly to the findings. Strictly adhere to the established coding standards."
early_access: false
enable_free_tier: true

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: false
  high_level_summary_placeholder: ""
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: "@coderabbitreview"
  auto_title_instructions: ""
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: true
  suggested_labels: false
  labeling_instructions: []
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: true
  poem: false
  path_filters:
    - "**/*.php"
    - "!**/.env*"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/vendor/**"  
  path_instructions:
    - path: "**/*.php"
      instructions: |
        Kiểm tra code PHP theo TẤT CẢ các quy tắc trong "CODING_STANDARDS.md".
        Yêu cầu:
        1. Kiểm tra MỌI dòng code, không bỏ sót vi phạm nào
        2. Ghi rõ số dòng bị vi phạm
        3. Đưa ra gợi ý sửa code cụ thể
        4. Ưu tiên các quy tắc CRITICAL và REQUIRED trước
  abort_on_close: true
  disable_cache: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    drafts: false
    base_branches:
      - main
      - master
      - develop
    labels:
      - "auto-review"
    ignore_usernames: []
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
      threshold: 80
    title:
      mode: "warning"
      requirements: "Title should start with a verb, be syntactically correct, and ideally be under 50 characters"
    description:
      mode: "off"
    issue_assessment:
      mode: "warning"
    custom_checks: []
