inheritance: true

reviews:
  path_filters:
    - "!**/.env*"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/vendor/**"
  path_instructions:
    - path: "**/*.php"
      instructions: |
        Check PHP code according to ALL rules in "CODING_STANDARDS.md".
        Requirements:
          1. Check EVERY line of code, do not miss any violations
          2. Clearly specify the line numbers of violations
          3. Provide specific code fix suggestions
          4. Prioritize CRITICAL and REQUIRED rules first
        When a standards violation is found, you MUST include the Rule ID at the beginning of the response if the rule exists in the "CODING_STANDARDS.md".
        Format: "[RULE-ID] <Rule Name>: <Explanation>"
        Example: [PHP-NAMING-003] Constants: Constants must use `UPPER_CASE_UNDERSCORE` format.
  auto_review:
    base_branches:
      - develop
  pre_merge_checks:
    title:
      mode: "error"
      requirements: "Title should start with a verb, be syntactically correct, and ideally be under 50 characters"
  tools:
    phpstan:
      enabled: true
      level: "8"
    semgrep:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    biome:
      enabled: true
    hadolint:
      enabled: true
    phpmd:
      enabled: true
    phpcs:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    eslint:
      enabled: true
    actionlint:
      enabled: true
    circleci:
      enabled: true
    oxc:
      enabled: true
    dotenvLint:
      enabled: true
    htmlhint:
      enabled: true
    checkmake:
      enabled: true
    osvScanner:
      enabled: true

knowledge_base:
  code_guidelines:
    filePatterns:
      - "**/.cursorrules"
      - "**/CODING_STANDARDS.md"
