language: "en-US"
tone_instructions: "Keep reviews concise and prioritize critical issues. Skip pleasantries and go directly to the findings. Strictly adhere to the established coding standards."
early_access: false
enable_free_tier: true

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: ""
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: ""
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: false
  related_issues: false
  related_prs: true
  suggested_labels: false
  labeling_instructions: []
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: true
  poem: false
  path_filters:
    - "!**/.env*"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/vendor/**"  
  path_instructions:
    - path: "**/*.php"
      instructions: |
        Check PHP code according to ALL rules in "CODING_STANDARDS.md".
        Requirements:
          1. Check EVERY line of code, do not miss any violations
          2. Clearly specify the line numbers of violations
          3. Provide specific code fix suggestions
          4. Prioritize CRITICAL and REQUIRED rules first
        When a standards violation is found, you MUST include the Rule ID at the beginning of the response.
        Format: "[RULE-ID] <Rule Name>: <Explanation>"
        Example: [TS-NAMING-001] CamelCase: Variables/functions must be `camelCase`.
  abort_on_close: true
  disable_cache: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    drafts: false
    base_branches:
      - develop
    labels:
      - coderabbit-review
    ignore_usernames: []
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
      threshold: 80
    title:
      mode: "error"
      requirements: "Title should start with a verb, be syntactically correct, and ideally be under 50 characters"
    description:
      mode: "off"
    issue_assessment:
      mode: "warning"
    custom_checks: []
  tools:
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
      enabled_only: false
      level: "default"
    ast-grep:
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
    golangci-lint:
      enabled: false
    phpstan:
      enabled: true
      level: "8"
    swiftlint:
      enabled: false
    detekt:
      enabled: false
    pmd:
      enabled: false
    semgrep:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: false
    markdownlint:
      enabled: true
    biome:
      enabled: true
    hadolint:
      enabled: true
    phpmd:
      enabled: true
    phpcs:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    eslint:
      enabled: true
    flake8:
      enabled: false
    rubocop:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    actionlint:
      enabled: true
    cppcheck:
      enabled: false
    circleci:
      enabled: true
    clippy:
      enabled: false
    sqlfluff:
      enabled: false
    prismaLint:
      enabled: false
    pylint:
      enabled: false
    oxc:
      enabled: true
    shopifyThemeCheck:
      enabled: false
    luacheck:
      enabled: true
    brakeman:
      enabled: false
    dotenvLint:
      enabled: true
    htmlhint:
      enabled: true
    checkmake:
      enabled: true
    osvScanner:
      enabled: true

chat:
  art: false
  auto_reply: true
  integrations: {}

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/.cursorrules"
      - "**/CODING_STANDARDS.md"
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"

code_generation:
  docstrings:
    language: "en-US"
  unit_tests:
    path_instructions: []
