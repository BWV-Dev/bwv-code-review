inheritance: true

reviews:
  path_filters:
    - "**/src/**"
    - "!**/.env*"
    - "!**/node_modules/**"
    - "!**/dist/**"  
  path_instructions: 
    - path: "**/src/**"
      instructions: |
        Carefully review based on "CODING_STANDARDS.md".
        When a standards violation is found, you MUST include the Rule ID at the beginning of the response if the rule exists in the "CODING_STANDARDS.md".
        Format: "[RULE-ID] <Rule Name>: <Explanation>"
        Example: [TS-NAMING-001] CamelCase: Variables/functions must be `camelCase`.
  auto_review:
    base_branches:
      - develop
  pre_merge_checks:
    title:
      mode: "error"
      requirements: "Title should start with a verb, be syntactically correct, and ideally be under 50 characters"
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    biome:
      enabled: true
    hadolint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    eslint:
      enabled: true
    actionlint:
      enabled: true
    semgrep:
      enabled: true
    circleci:
      enabled: true
    prismaLint:
      enabled: true
    oxc:
      enabled: true
    dotenvLint:
      enabled: true
    htmlhint:
      enabled: true
    checkmake:
      enabled: true
    osvScanner:
      enabled: true

knowledge_base:
  code_guidelines:
    filePatterns:
      - "**/.cursorrules"
      - "**/CODING_STANDARDS.md"
